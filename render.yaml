services:
  - type: web
    name: avtobus-yonalishi
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_GEOFENCE_RADIUS
        value: 100
      - key: GPS_STALE_THRESHOLD_SECONDS
        value: 120
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DEFAULT_TELEGRAM_CHAT_ID
        sync: false
